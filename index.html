-radius:12px;padding:10px;font-size:12px;color:#785015;margin:10px 0}.empty{border:1px dashed #c3d8d5;border-radius:12px;padding:16px;text-align:center;color:var(--muted)}.checkrow{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:9px 0}.checkrow input{width:19px;min-height:19px;height:19px}.checkrow span{flex:1}.timer{font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;letter-spacing:2px;text-align:center;color:var(--primary)}.floating{position:fixed;inset:0;background:#0a19228c;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;max-height:90vh;overflow:auto;border-radius:23px 23px 0 0;width:100%;max-width:760px;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 8px;font-size:21px}.x{border:0;background:#ecf4f3;border-radius:10px;padding:8px 12px}.chip{border:1px solid #d7e4e3;background:#fff;border-radius:12px;padding:8px 10px;font-size:13px}.copy{white-space:pre-wrap}.graphlabel{font-size:10px;fill:#70818e}.headerline{font-size:13px;color:#607381}.info{font-size:12px;color:#627587;margin-top:7px}.weekbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.weekbar button{min-width:52px}.skeleton{color:#69818b}@media(min-width:700px){.tabs{width:760px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}.container{padding:0 22px}.top{padding-left:22px;padding-right:22px}}@media(max-width:390px){.grid3{grid-template-columns:repeat(2,1fr)}.brand{font-size:18px}.top select{max-width:112px}.formgrid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap"><div class="toprow"><div><div class="brand">Nubi<span>vanta</span> Fit</div><div class="sub">Tu bienestar, a tu ritmo</div></div><div class="headControls"><select id="profileSwitch" aria-label="Perfil"></select><button onclick="openProfile()" aria-label="Gestionar perfil">⚙️</button></div></div></div></header><main class="container wrap"><div id="screen"></div></main><nav class="tabs" aria-label="Navegación"><button data-tab="hoy" class="active" onclick="go('hoy')"><b>⌂</b>Hoy</button><button data-tab="entrenos" onclick="go('entrenos')"><b>◷</b>Entrenos</button><button data-tab="nutricion" onclick="go('nutricion')"><b>◉</b>Nutrición</button><button data-tab="evolucion" onclick="go('evolucion')"><b>↗</b>Evolución</button><button data-tab="compra" onclick="go('compra')"><b>☑</b>Compra</button></nav><div id="modal"></div>
<script>
'use strict';const KEY='nubivanta_fit_piloto_02', today=()=>new Date().toLocaleDateString('en-CA'), dayNames=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];let view='hoy', selectedDate=today(), timerId=null,timerEnd=0,timerSeconds=120;const uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=v=>Number(v)||0, fmt=n=>Math.round(n).toLocaleString('es-ES'), dateFmt=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}), formatDay=s=>dayNames[new Date(s+'T12:00:00').getDay()], isoAdd=(s,d)=>{const a=new Date(s+'T12:00:00');a.setDate(a.getDate()+d);return a.toLocaleDateString('en-CA')}, startWeek=(s)=>{const d=new Date(s+'T12:00:00');return isoAdd(s,-((d.getDay()+6)%7))};
const defaultProfile=(name='Mi perfil',special=false)=>({id:uid(),name,goal:'recomposicion',level:'intermedio',height:'',weight:'',age:'',activity:'moderada',kcal:2200,protein:130,carbs:220,fats:70,location:'casa',equipment:'Mancuernas, esterilla',restrictions:special?'Embarazo: confirmar pautas con su profesional sanitario':'',notes:'',days:[1,3,5],minutes:40,preferredSport:'fuerza',reminder:false});let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||!Array.isArray(state.profiles)){let a=defaultProfile('Mi perfil'),b=defaultProfile('Segundo perfil',true);state={profiles:[a,b],active:a.id,meals:[],workouts:[],weights:[],photos:[],shopping:[],plans:[],events:[]}}const p=()=>state.profiles.find(x=>x.id===state.active)||state.profiles[0],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('El almacenamiento está lleno. Exporta tus datos y elimina fotos antiguas.');return false}},own=arr=>arr.filter(x=>x.pid===p().id),money=items=>items.reduce((a,x)=>a+num(x.kcal),0),mac=(items,k)=>items.reduce((a,x)=>a+num(x[k]),0),foodDay=(d)=>own(state.meals).filter(x=>x.date===d),workDay=(d)=>own(state.workouts).filter(x=>x.date===d),plDay=(d)=>own(state.plans).find(x=>x.date===d),weightDay=()=>own(state.weights).sort((a,b)=>a.date.localeCompare(b.date));
function selectProfiles(){document.querySelector('#profileSwitch').innerHTML=state.profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');document.querySelector('#profileSwitch').value=p().id}document.querySelector('#profileSwitch').addEventListener('change',e=>{state.active=e.target.value;selectedDate=today();save();render();if(!p().setupComplete)onboarding(0)});
function go(v){view=v;render();scrollTo({top:0,behavior:'smooth'})}function render(){selectProfiles();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));document.querySelector('#screen').innerHTML=({hoy:home,entrenos:training,nutricion:nutrition,evolucion:progress,compra:shopping})[view]();}function heading(txt,sub=''){return `<div class="sectionTitle">${txt}</div>${sub?`<div class="muted small">${sub}</div>`:''}`}
const sessionTemplates={fuerza:[['Sentadilla o variante',3,8,120],['Peso muerto rumano',3,10,90],['Remo con mancuerna',3,10,75],['Flexiones o press',3,10,75],['Plancha',3,30,45]],funcional:[['Sentadilla a banco',3,12,45],['Remo con goma',3,12,45],['Flexiones adaptadas',3,10,45],['Zancadas controladas',3,10,45],['Plancha',3,30,45]],correr:[['Carrera fácil (minutos)',1,30,0]],bici:[['Bicicleta moderada (minutos)',1,35,0]],movilidad:[['Movilidad de cadera',2,8,20],['Movilidad de tobillo',2,8,20],['Movilidad torácica',2,8,20]],padel:[['Pádel (minutos)',1,90,0]]};
function planSession(date,type,minutes,place){const base=sessionTemplates[type]||sessionTemplates.fuerza;const factor=minutes/40;return {id:uid(),pid:p().id,date,type,minutes,place:place||p().location,title:({fuerza:'Fuerza',funcional:'Funcional',correr:'Carrera',bici:'Bicicleta',movilidad:'Movilidad',padel:'Pádel'})[type]||type,exercises:base.map(([name,sets,reps,rest])=>({id:uid(),name,sets,reps,rest,actual:[]})),completed:false,notes:'',intensity:'moderada',kcal:null}}
const generateWeek=function smartWeek(){
 const first=startWeek(selectedDate),x=p(),days=x.days||[],all=[];
 for(let i=0;i<7;i++){const date=isoAdd(first,i);if(days.includes(new Date(date+'T12:00:00').getDay()))all.push(date)}
 if(!all.length){toast('Selecciona los días disponibles');weekSettings();return}
 const goal=x.goal||'bienestar',restricted=!!x.special||/embarazo|operad|cirug|lesi[oó]n|dolor|rehabilitaci/i.test(x.restrictions||'');
 let added=0;
 for(let i=0;i<all.length;i++){
   let date=all[i];if(own(state.plans).some(y=>y.date===date))continue;
   let type,reason;
   if(restricted){type='movilidad';reason='Propuesta suave provisional. Confirma las restricciones con tu profesional sanitario antes de entrenar.'}
   else if(goal==='resistencia'||goal==='competicion'){type=['correr','fuerza','bici','movilidad'][i%4];reason='Resistencia combinada con fuerza y movilidad. Ajusta las intensidades a tu nivel.'}
   else if(goal==='ganar'||goal==='perder'||goal==='recomposicion'){type=['fuerza','funcional','fuerza','movilidad'][i%4];reason='Alternancia de fuerza, actividad funcional y movilidad.'}
   else{type=['funcional','movilidad','bici'][i%3];reason='Actividad variada orientada a la constancia.'}
   let q=planSession(date,type,Number(x.minutes)||40,x.location);
   if(type==='fuerza'&&i%4===2){
     q.title='Fuerza · Tren superior';q.exercises=[
       ['Remo con banda o mancuerna',3,10,75],['Press o flexiones',3,10,75],
       ['Elevaciones laterales',2,12,60],['Movilidad torácica',2,8,20]
     ].map(([name,sets,reps,rest])=>({id:uid(),name,sets,reps,rest,actual:[]}));
   }
   if(type==='fuerza'&&i%4===0){
     q.title='Fuerza · Cuerpo completo';q.exercises.push({id:uid(),name:'Movilidad de tobillo y cadera',sets:2,reps:8,rest:20,actual:[]});
   }
   q.reason=reason;q.notes=reason;
   state.plans.push(q);added++;
 }
 if(!save())return;
 render();toast(added?`Creadas ${added} sesiones diferentes`:'La semana ya tiene sesiones; puedes cambiarlas');
};
function estimateActive(type,minutes,weight,intensity='moderada'){const mets={fuerza:3.5,funcional:5.5,correr:8,bici:6.5,movilidad:2.5,padel:5.5,remo:6.5,caminar:3.5};const mult={suave:.75,moderada:1,alta:1.25}[intensity]||1;const met=(mets[type]||4)*mult;return Math.max(0,Math.round((met-1)*3.5*(weight||70)*minutes/200))}function energy(date){const workouts=workDay(date);let active=workouts.reduce((s,w)=>s+(w.kcal===null||w.kcal===undefined?estimateActive(w.type,num(w.minutes),num(p().weight)||70,w.intensity):num(w.kcal)),0);return active}function plannedEnergy(date){let x=plDay(date);return x?estimateActive(x.type,num(x.minutes),num(p().weight)||70,'moderada'):0}function targets(date){let base=num(p().kcal)||2200;return base+Math.max(0,energy(date)-Math.round(plannedEnergy(date)*.7))}
function home(){let d=selectedDate,food=foodDay(d),w=workDay(d),plan=plDay(d),k=money(food),goal=targets(d),active=energy(d);return `<div class="hero card"><div class="between"><div><div class="tag">${dateFmt(d)}</div><h2 style="margin:9px 0 3px">Hola, ${esc(p().name)} 👋</h2><div class="muted">Tu día, sin complicaciones</div></div><button class="btn secondary tiny" onclick="showDatePicker()">📅 Fecha</button></div><div class="grid2" style="margin-top:17px"><div class="stat"><span class="small muted">Calorías ingeridas</span><strong>${fmt(k)}</strong><span class="small">de ${fmt(goal)} kcal objetivo</span><div class="progress"><div style="width:${Math.min(100,k/goal*100)}%"></div></div></div><div class="stat"><span class="small muted">Actividad registrada</span><strong>${fmt(active)}</strong><span class="small">kcal activas estimadas</span></div></div><div class="grid3" style="margin-top:10px"><div class="stat"><strong>${fmt(mac(food,'protein'))}g</strong><span class="small">Proteína</span></div><div class="stat"><strong>${fmt(mac(food,'carbs'))}g</strong><span class="small">Carbohidratos</span></div><div class="stat"><strong>${fmt(mac(food,'fats'))}g</strong><span class="small">Grasas</span></div></div><div class="info">Balance orientativo: quedan ${fmt(Math.max(0,goal-k))} kcal para tu objetivo de ingesta. No es una medición de gasto real.</div></div>${heading('Tu entrenamiento de hoy')}${plan?`<div class="card"><div class="between"><div><b>${esc(plan.title)} · ${plan.minutes} min</b><div class="muted small">${esc(plan.place)} · ${plan.exercises.length} ejercicios</div></div><span class="tag">${w.length?'Registrado':'Previsto'}</span></div><div class="actions"><button class="btn" onclick="openWorkout('${plan.id}')">${w.length?'Ver / registrar':'Empezar / registrar'}</button><button class="btn secondary" onclick="swapPlan('${plan.id}')">Cambiar plan</button></div></div>`:`<div class="card"><div class="muted">Sin sesión planificada para hoy.</div><div class="actions"><button class="btn" onclick="createPlan('${d}')">Planificar</button><button class="btn secondary" onclick="quickWorkout('${d}')">Registrar actividad</button></div></div>`}<div class="card"><div class="between"><div><b>Movilidad diaria</b><div class="muted small">Siempre visible · 3–10 min, adaptable</div></div><button class="btn secondary tiny" onclick="mobility()">Ver rutina</button></div></div>${heading('Accesos rápidos')}<div class="grid2"><button class="pill" onclick="mealForm()">📷 Añadir comida</button><button class="pill" onclick="quickWorkout('${d}')">🏃 Actividad</button><button class="pill" onclick="weightForm()">⚖️ Peso</button><button class="pill" onclick="changeToday()">↔️ Cambió mi día</button></div><div class="card"><b>Prueba la planificación flexible</b><p class="muted small">Organiza la semana y cambia una sesión por otra cuando no tengas tiempo, material o estés en otro lugar.</p><button class="btn secondary" onclick="go('entrenos')">Ver semana</button></div>`}
function training(){const first=startWeek(selectedDate);return `${heading('Entrenamientos','Plan adaptable por disponibilidad, lugar y material')}<div class="card"><div class="between"><b>Semana del ${dateFmt(first)}</b><button class="btn secondary tiny" onclick="weekSettings()">⚙️ Configurar</button></div><div class="weekbar">${Array.from({length:7},(_,i)=>{let d=isoAdd(first,i);return `<button class="pill ${selectedDate===d?'on':''}" onclick="selectedDate='${d}';render()"><b>${['L','M','X','J','V','S','D'][i]}</b><br>${d.slice(-2)}</button>`}).join('')}</div><div class="actions"><button class="btn" onclick="generateWeek()">Generar plan semanal</button><button class="btn secondary" onclick="createPlan('${selectedDate}')">+ Planificar sesión</button></div></div><div class="card">${Array.from({length:7},(_,i)=>{let d=isoAdd(first,i),q=plDay(d),completed=workDay(d).length>0;return `<div class="dayrow"><div class="daybadge">${formatDay(d).slice(0,3)}<br><span class="muted small">${d.slice(-2)}</span></div><div>${q?`<b>${esc(q.title)} · ${q.minutes} min</b><div class="muted small">${esc(q.place)} ${completed?'· ✓ realizado':''}</div><div class="actions"><button class="btn tiny secondary" onclick="openWorkout('${q.id}')">Abrir</button><button class="btn tiny ghost" onclick="swapPlan('${q.id}')">Cambiar</button></div>`:`<span class="muted">Día libre</span> <button class="btn tiny ghost" onclick="createPlan('${d}')">+ Añadir</button>`}</div></div>`}).join('')}</div>${heading('Actividades registradas')}${own(state.workouts).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(w=>`<div class="card between"><div><b>${esc(w.title||w.type)}</b><div class="muted small">${dateFmt(w.date)} · ${w.minutes} min · ${w.kcal??estimateActive(w.type,w.minutes,num(p().weight)||70,w.intensity)} kcal activas est.</div></div><button class="x" onclick="deleteItem('workouts','${w.id}')">Eliminar</button></div>`).join('')||'<div class="empty">Aún no has registrado actividades.</div>'}<button class="btn secondary" onclick="quickWorkout('${selectedDate}')">+ Registrar actividad libre</button>`}
function nutrition(){let d=selectedDate,food=foodDay(d),goal=targets(d);return `${heading('Nutrición','Registro práctico: calorías, macros y fotos')}<div class="card"><div class="between"><b>${dateFmt(d)}</b><button class="btn secondary tiny" onclick="showDatePicker()">Cambiar fecha</button></div><div class="grid3" style="margin-top:12px"><div class="stat"><strong>${fmt(money(food))}</strong><span class="small">kcal</span></div><div class="stat"><strong>${fmt(mac(food,'protein'))}g</strong><span class="small">Proteínas</span></div><div class="stat"><strong>${fmt(Math.max(0,goal-money(food)))}</strong><span class="small">kcal restantes</span></div></div><div class="progress"><div style="width:${Math.min(100,money(food)/goal*100)}%"></div></div><div class="info">Objetivo diario estimado ${fmt(goal)} kcal; se ajusta con la actividad registrada de forma orientativa.</div><div class="actions"><button class="btn" onclick="mealForm()">+ Añadir comida</button><button class="btn secondary" onclick="mealAlternatives()">Alternativa de comida</button></div></div>${food.length?food.map(m=>`<div class="card"><div class="between"><div><span class="tag">${esc(m.meal)}</span><b style="display:block;margin-top:5px">${esc(m.name)}</b><div class="muted small">${fmt(m.kcal)} kcal · P ${m.protein} g · C ${m.carbs} g · G ${m.fats} g</div></div>${m.photo?`<img src="${m.photo}" alt="Comida registrada" style="width:80px;height:80px;border-radius:12px;object-fit:cover">`:''}</div><div class="actions"><button class="btn ghost tiny" onclick="deleteItem('meals','${m.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">Todavía no hay comidas registradas en este día.</div>'}<div class="notice">Las calorías y los macros se introducen manualmente en este piloto. La fotografía se adjunta para consulta; todavía no hay reconocimiento automático mediante IA. Para embarazo no se recomiendan objetivos de déficit automáticos.</div>`}
function progress(){let ws=weightDay(),photos=own(state.photos).sort((a,b)=>b.date.localeCompare(a.date));let datapoints=ws.slice(-24);let values=datapoints.map(x=>num(x.weight));let min=Math.min(...values,0),max=Math.max(...values,1);if(values.length){min=Math.min(...values)-1;max=Math.max(...values)+1}let pts=datapoints.map((x,i)=>{let xx=35+(datapoints.length===1?140:i*280/(datapoints.length-1)),yy=148-(num(x.weight)-min)/(max-min)*110;return `${xx},${yy}`}).join(' ');return `${heading('Evolución','Peso, fotos y progreso personal')}<div class="card"><div class="between"><b>Registro de peso</b><button class="btn secondary tiny" onclick="weightForm()">+ Peso</button></div>${ws.length?`<svg viewBox="0 0 340 180" class="chart" role="img" aria-label="Evolución del peso"><line x1="30" x2="325" y1="150" y2="150" stroke="#c4d4d8"/><line x1="30" x2="30" y1="25" y2="150" stroke="#c4d4d8"/><text x="0" y="34" class="graphlabel">${max.toFixed(1)}</text><text x="0" y="150" class="graphlabel">${min.toFixed(1)}</text><polyline points="${pts}" fill="none" stroke="#0f8777" stroke-width="3"/>${datapoints.map((x,i)=>{let xx=35+(datapoints.length===1?140:i*280/(datapoints.length-1)),yy=148-(num(x.weight)-min)/(max-min)*110;return `<circle cx="${xx}" cy="${yy}" r="5" fill="#0f8777" onclick="showWeight('${x.id}')" style="cursor:pointer"><title>${esc(x.date)}: ${x.weight} kg</title></circle>`}).join('')}</svg><div class="muted small">Toca cualquier punto para consultar la fecha y sus fotografías.</div>`:'<div class="empty">Añade tu primer peso para ver la gráfica.</div>'}</div><div class="card"><div class="between"><b>Fotos de evolución</b><button class="btn secondary tiny" onclick="photoForm()">+ Foto</button></div>${photos.length?`<div class="grid2" style="margin-top:12px">${photos.slice(0,6).map(f=>`<button style="border:0;background:none;text-align:left;padding:0" onclick="showPhoto('${f.id}')"><img class="photo" src="${f.image}" alt="Evolución ${esc(f.date)}"><div class="small">${dateFmt(f.date)}</div></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="comparePhotos()">Comparar 2 fechas</button></div>`:'<div class="empty">Añade fotos para comparar tu evolución.</div>'}</div><div class="card"><b>Exportar tu información</b><p class="muted small">Guarda un archivo de seguridad de todos tus registros o imprime un informe del perfil.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Exportar datos JSON</button><button class="btn secondary" onclick="printReport()">Informe / PDF</button><button class="btn ghost" onclick="importData()">Importar copia</button></div></div>`}
function shopping(){let xs=own(state.shopping);return `${heading('Lista de la compra','Compartible con cualquier persona')}<div class="card"><div class="between"><b>${xs.filter(x=>x.done).length} de ${xs.length} comprados</b><button class="btn secondary tiny" onclick="copyShopping()">Compartir</button></div><form onsubmit="addShopping(event)"><div style="display:flex;gap:8px;margin-top:12px"><input name="item" placeholder="Ej.: huevos · 12 unidades" required><button class="btn" type="submit">Añadir</button></div></form><div style="margin-top:14px">${xs.length?xs.map(x=>`<div class="checkrow"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShopping('${x.id}')"><span style="${x.done?'text-decoration:line-through;color:#74868a':''}">${esc(x.name)}</span><button class="x" onclick="deleteItem('shopping','${x.id}')">×</button></div>`).join(''):'<div class="empty">Todavía no hay productos.</div>'}</div><div class="actions"><button class="btn ghost tiny" onclick="clearBought()">Eliminar comprados</button><button class="btn secondary tiny" onclick="addSuggestedShopping()">Añadir básicos sugeridos</button></div></div><div class="notice">En esta primera versión la lista se comparte como texto mediante el menú del iPhone. Los dos perfiles tienen listas separadas y los cambios no se sincronizan entre móviles.</div>`}
function modal(title,body){document.querySelector('#modal').innerHTML=`<div class="floating" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="between"><h2>${title}</h2><button class="x" onclick="closeModal()">Cerrar ✕</button></div>${body}</div></div>`}function closeModal(){document.querySelector('#modal').innerHTML=''}function toast(s){let el=document.createElement('div');el.textContent=s;Object.assign(el.style,{position:'fixed',bottom:'105px',left:'50%',transform:'translateX(-50%)',background:'#142c35',color:'white',padding:'12px 18px',borderRadius:'12px',zIndex:'70',maxWidth:'90%',textAlign:'center'});document.body.append(el);setTimeout(()=>el.remove(),2500)}function showDatePicker(){modal('Elegir fecha',`<label>Fecha</label><input id="dateinput" type="date" value="${selectedDate}"><button class="btn" style="margin-top:12px" onclick="selectedDate=document.querySelector('#dateinput').value||today();closeModal();render()">Ver fecha</button>`)}

function saveProfile(e){e.preventDefault();let f=new FormData(e.target),x=p();for(let k of ['name','goal','level','location','equipment','restrictions'])x[k]=f.get(k);for(let k of ['weight','height','age','kcal','protein','carbs','fats'])x[k]=num(f.get(k));save();closeModal();render();toast('Perfil actualizado')};function newProfile(){let name=prompt('Nombre del nuevo perfil');if(!name?.trim())return;let x=defaultProfile(name.trim());state.profiles.push(x);state.active=x.id;save();closeModal();render();onboarding(0)}
function weekSettings(){let x=p();modal('Planificación semanal',`<form onsubmit="saveWeek(event)"><div class="muted small">Selecciona los días habituales disponibles. Puedes cambiar una sesión concreta después.</div><div class="weekbar">${[['L',1],['M',2],['X',3],['J',4],['V',5],['S',6],['D',0]].map(([t,d])=>`<label class="pill ${x.days.includes(d)?'on':''}" style="min-width:48px"><input type="checkbox" name="days" value="${d}" ${x.days.includes(d)?'checked':''} style="min-height:0;width:14px;height:14px"> ${t}</label>`).join('')}</div><label>Tiempo habitual (min)</label><input type="number" min="10" max="240" name="minutes" value="${x.minutes}"><label>Tipo de entrenamiento principal</label><select name="preferredSport">${Object.keys(sessionTemplates).map(v=>`<option value="${v}" ${x.preferredSport===v?'selected':''}>${v}</option>`).join('')}</select><label>Material habitual (para personalizar sustituciones)</label><textarea name="equipment">${esc(x.equipment)}</textarea><button class="btn" style="margin-top:12px">Guardar disponibilidad</button></form>`)}function saveWeek(e){e.preventDefault();let f=new FormData(e.target),x=p();x.days=f.getAll('days').map(Number);x.minutes=num(f.get('minutes'))||40;x.preferredSport=f.get('preferredSport');x.equipment=f.get('equipment');save();closeModal();render()}
function createPlan(date){modal('Planificar sesión',`<form onsubmit="saveNewPlan(event,'${date}')"><label>Fecha</label><input type="date" name="date" value="${date}" required><div class="formgrid"><div><label>Tipo</label><select name="type">${Object.keys(sessionTemplates).map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>Minutos disponibles</label><input type="number" name="minutes" value="${p().minutes}" min="5" max="300"></div></div><label>Lugar</label><select name="place">${['casa','gimnasio','exterior','viaje'].map(v=>`<option ${p().location===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn" style="margin-top:13px">Crear sesión</button></form>`)}function saveNewPlan(e,date){e.preventDefault();let f=new FormData(e.target),d=f.get('date'),existing=plDay(d);if(existing){if(!confirm('Ya existe una sesión en esa fecha. ¿Sustituirla?'))return;state.plans=state.plans.filter(x=>x.id!==existing.id)}state.plans.push(planSession(d,f.get('type'),num(f.get('minutes')),f.get('place')));selectedDate=d;save();closeModal();render()}
function swapPlan(id){let w=state.plans.find(x=>x.id===id);if(!w)return;modal('Cambiar entrenamiento',`<p class="muted small">Sustituye esta sesión sin perder los registros ya realizados.</p><form onsubmit="saveSwap(event,'${id}')"><label>Motivo</label><select name="reason"><option>Tengo menos tiempo</option><option>Estoy en otro lugar</option><option>No tengo material</option><option>Prefiero otro deporte</option><option>Tengo molestias</option></select><label>Nuevo tipo</label><select name="type">${Object.keys(sessionTemplates).map(t=>`<option ${w.type===t?'selected':''}>${t}</option>`).join('')}</select><div class="formgrid"><div><label>Minutos disponibles</label><input name="minutes" type="number" value="${w.minutes}" min="5" max="300"></div><div><label>Lugar</label><select name="place">${['casa','gimnasio','exterior','viaje'].map(v=>`<option ${w.place===v?'selected':''}>${v}</option>`).join('')}</select></div></div><button class="btn" style="margin-top:13px">Adaptar sesión</button></form><div class="notice">Las equivalencias son orientativas. Bici o remo pueden sustituir parte del trabajo cardiovascular, pero no todos los estímulos específicos de correr.</div>`)}function saveSwap(e,id){e.preventDefault();let f=new FormData(e.target),x=state.plans.find(x=>x.id===id);let nw=planSession(x.date,f.get('type'),num(f.get('minutes')),f.get('place'));nw.id=x.id;Object.assign(x,nw);save();closeModal();render();toast('Sesión adaptada')}
function openWorkout(id){let w=state.plans.find(x=>x.id===id);if(!w)return;let last=own(state.workouts).filter(a=>a.type===w.type&&a.date<w.date).sort((a,b)=>b.date.localeCompare(a.date))[0];modal('Entrenar · '+esc(w.title),`<div class="between"><span class="tag">${dateFmt(w.date)} · ${w.minutes} min</span><span class="muted small">${esc(w.place)}</span></div><div class="notice">Modo guiado: al registrar una serie se activa el descanso opcional. La cuenta atrás requiere mantener esta página abierta; los avisos en segundo plano no están implementados.</div><div class="card"><div class="between"><b>Descanso opcional</b><label style="margin:0"><input id="timerEnabled" type="checkbox" checked style="width:18px;min-height:18px"> Activar</label></div><div class="timer" id="timerDisplay">02:00</div><div class="actions"><button class="btn tiny secondary" onclick="stopTimer()">Parar</button><button class="btn tiny ghost" onclick="startTimer(60)">1 min</button><button class="btn tiny ghost" onclick="startTimer(120)">2 min</button></div></div><div id="exerciseBlocks">${w.exercises.map((e,i)=>`<div class="workoutExercise"><div class="between"><b>${i+1}. ${esc(e.name)}</b><button class="btn tiny secondary" onclick="alternative('${w.id}','${e.id}')">Cambiar</button></div><div class="muted small">${e.sets} × ${e.reps} · Descanso ${e.rest}s</div><div class="muted small">${last?.exercises?.find(z=>z.name===e.name)?.actual?.slice(-1).map(z=>`Último registro: ${z.kg} kg · ${z.reps} reps`).join('')||'Sin registro anterior'}</div><div class="formgrid"><div><label>Peso (kg)</label><input id="kg_${e.id}" type="number" min="0" step="0.5" placeholder="0"></div><div><label>Repeticiones / min</label><input id="rep_${e.id}" type="number" min="0" value="${e.reps}"></div><div><label>RPE (opcional)</label><input id="rpe_${e.id}" type="number" min="1" max="10" step="0.5" placeholder="1–10"></div></div><div class="actions"><button class="btn tiny" onclick="logSet('${w.id}','${e.id}')">✓ Registrar serie</button></div><div id="logged_${e.id}" class="muted small">${e.actual.length} series registradas</div></div>`).join('')}</div><form onsubmit="finishWorkout(event,'${w.id}')"><div class="formgrid"><div><label>Duración real (min)</label><input type="number" name="minutes" min="1" value="${w.minutes}"></div><div><label>Intensidad</label><select name="intensity"><option>suave</option><option selected>moderada</option><option>alta</option></select></div><div class="full"><label>Calorías activas medidas (opcional)</label><input type="number" name="kcal" min="0" placeholder="Vacío = estimación"></div></div><label>Notas</label><textarea name="notes" placeholder="Cómo ha ido, molestias, cambios..."></textarea><button class="btn" style="margin-top:12px">Finalizar y guardar</button></form>`)}
function logSet(wid,eid){let w=state.plans.find(x=>x.id===wid),e=w.exercises.find(x=>x.id===eid);let kg=num(document.getElementById('kg_'+eid).value),reps=num(document.getElementById('rep_'+eid).value),rpe=num(document.getElementById('rpe_'+eid).value);e.actual.push({kg,reps,rpe,at:new Date().toISOString()});save();document.getElementById('logged_'+eid).textContent=`${e.actual.length} series registradas · última ${kg} kg × ${reps}`;if(document.getElementById('timerEnabled')?.checked&&e.rest)startTimer(e.rest);toast('Serie registrada')}
function startTimer(seconds){stopTimer();timerSeconds=seconds;timerEnd=Date.now()+seconds*1000;const el=document.querySelector('#timerDisplay');if(el)el.textContent=displayTimer(seconds);timerId=setInterval(()=>{let remain=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let e=document.querySelector('#timerDisplay');if(e)e.textContent=displayTimer(remain);if(!remain){stopTimer();if(navigator.vibrate)navigator.vibrate([180,100,180]);toast('Descanso terminado · siguiente serie')}} ,250)}function displayTimer(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
function alternative(wid,eid){let w=state.plans.find(x=>x.id===wid),e=w.exercises.find(x=>x.id===eid);let suggestions={'Sentadilla o variante':['Sentadilla libre','Prensa de piernas','Sentadilla con mancuernas','Sentadilla a banco'],'Peso muerto rumano':['Puente de glúteos','Peso muerto con mancuernas'],'Remo con mancuerna':['Remo con goma','Remo en máquina'],'Flexiones o press':['Press con mancuernas','Press en máquina','Flexiones inclinadas']};let opts=suggestions[e.name]||['Variante con mancuernas','Variante con goma','Ejercicio equivalente adaptado'];modal('Cambiar ejercicio',`<p class="muted">Original: ${esc(e.name)}</p><label>Alternativas sugeridas</label>${opts.map(o=>`<button class="pill" style="display:block;width:100%;margin:7px 0;text-align:left" onclick="setAlternative('${wid}','${eid}',${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}<label>O escribe tu alternativa</label><input id="customExercise" placeholder="Ejercicio disponible"><button class="btn" style="margin-top:10px" onclick="setAlternative('${wid}','${eid}',document.querySelector('#customExercise').value)">Guardar alternativa</button>`)}function setAlternative(wid,eid,name){if(!name.trim())return;let e=state.plans.find(x=>x.id===wid).exercises.find(x=>x.id===eid);e.name=name;save();openWorkout(wid)}
function finishWorkout(evt,id){evt.preventDefault();let f=new FormData(evt.target),w=state.plans.find(x=>x.id===id);let copy=JSON.parse(JSON.stringify(w));copy.id=uid();copy.minutes=num(f.get('minutes'));copy.intensity=f.get('intensity');copy.notes=f.get('notes');copy.kcal=f.get('kcal')===''?null:num(f.get('kcal'));copy.completed=true;state.workouts.push(copy);w.completed=true;save();stopTimer();closeModal();render();toast('Entrenamiento guardado')}
function quickWorkout(date){modal('Registrar actividad',`<form onsubmit="saveQuickWorkout(event)"><label>Fecha</label><input type="date" name="date" value="${date}"><div class="formgrid"><div><label>Actividad</label><select name="type">${[...Object.keys(sessionTemplates),'remo','caminar'].map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>Duración (min)</label><input type="number" min="1" name="minutes" value="45"></div><div><label>Intensidad</label><select name="intensity"><option>suave</option><option selected>moderada</option><option>alta</option></select></div><div><label>Kcal activas medidas</label><input type="number" min="0" name="kcal" placeholder="Opcional"></div></div><label>Notas</label><textarea name="notes"></textarea><button class="btn" style="margin-top:12px">Guardar actividad</button></form>`)}function saveQuickWorkout(e){e.preventDefault();let f=new FormData(e.target),type=f.get('type');state.workouts.push({id:uid(),pid:p().id,date:f.get('date'),type,title:type,minutes:num(f.get('minutes')),intensity:f.get('intensity'),kcal:f.get('kcal')===''?null:num(f.get('kcal')),notes:f.get('notes'),exercises:[],completed:true});save();closeModal();render();toast('Actividad registrada')}

function compress(file,max=850){return new Promise((resolve,reject)=>{let im=new Image,reader=new FileReader;reader.onload=()=>{im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height));let canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.62))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveMeal(e){e.preventDefault();let f=new FormData(e.target),photo=f.get('photo'),image='';if(photo?.size){try{image=await compress(photo)}catch{alert('No se pudo procesar la foto');return}}let obj={id:uid(),pid:p().id,date:f.get('date'),meal:f.get('meal'),name:f.get('name'),kcal:num(f.get('kcal')),protein:num(f.get('protein')),carbs:num(f.get('carbs')),fats:num(f.get('fats')),photo:image};state.meals.push(obj);if(!save()){state.meals.pop();return}closeModal();render();toast('Comida guardada')}
function mealAlternatives(){modal('Cambiar una comida',`<p class="muted">En esta primera versión puedes elegir una alternativa manualmente. El ajuste inteligente a ingredientes, preferencias y macros mediante IA se integrará en una fase posterior.</p><label>¿Qué tienes en casa?</label><textarea id="availableFood" placeholder="Huevos, patatas, arroz, verduras..."></textarea><label>¿Cuántos minutos tienes para cocinar?</label><select id="cookTime"><option>10</option><option>20</option><option>30</option><option>45</option></select><div class="card"><b>Opciones sencillas para empezar</b><p>• Tortilla con patata y ensalada</p><p>• Arroz con legumbres y verduras</p><p>• Yogur natural con fruta y avena</p><div class="info">Las cantidades y los macros dependen de ingredientes y porciones. Confírmalos antes de registrarlos.</div></div><button class="btn" onclick="closeModal();mealForm()">Registrar la opción elegida</button>`)}
function weightForm(){modal('Registrar peso',`<form onsubmit="saveWeight(event)"><label>Fecha</label><input type="date" name="date" value="${selectedDate}"><label>Peso (kg)</label><input type="number" name="weight" step="0.05" min="1" required placeholder="72.50"><button class="btn" style="margin-top:13px">Guardar</button></form>`)}function saveWeight(e){e.preventDefault();let f=new FormData(e.target),date=f.get('date');state.weights=state.weights.filter(x=>!(x.pid===p().id&&x.date===date));state.weights.push({id:uid(),pid:p().id,date,weight:num(f.get('weight'))});p().weight=num(f.get('weight'));save();closeModal();render()}
function photoForm(){modal('Añadir foto de evolución',`<form onsubmit="savePhoto(event)"><label>Fecha</label><input type="date" name="date" value="${selectedDate}"><label>Fotografía</label><input name="photo" type="file" accept="image/*" required><label>Notas (opcional)</label><input name="notes" placeholder="Mañana, misma luz..."><div class="notice">Las fotos se guardan solamente en este navegador, sin nube. No se calcula un porcentaje de grasa corporal desde la imagen.</div><button class="btn" style="margin-top:12px">Guardar foto</button></form>`)}async function savePhoto(e){e.preventDefault();let f=new FormData(e.target);try{let image=await compress(f.get('photo'));state.photos.push({id:uid(),pid:p().id,date:f.get('date'),image,notes:f.get('notes')});if(!save()){state.photos.pop();return}closeModal();render()}catch(err){alert('No se pudo leer la foto')}}function showPhoto(id){let x=state.photos.find(z=>z.id===id);if(x)modal('Foto · '+dateFmt(x.date),`<img class="photo" src="${x.image}" alt="Foto de evolución"><p>${esc(x.notes)}</p><button class="btn ghost" onclick="deleteItem('photos','${id}')">Eliminar foto</button>`)}function showWeight(id){let x=state.weights.find(z=>z.id===id);if(!x)return;let photo=own(state.photos).find(z=>z.date===x.date);modal('Registro · '+dateFmt(x.date),`<h2>${x.weight} kg</h2>${photo?`<img class="photo" src="${photo.image}" alt="Foto en la fecha">`:'<p class="muted">No hay foto guardada para esta fecha.</p>'}<button class="btn ghost" onclick="deleteItem('weights','${id}')">Eliminar registro</button>`)}function comparePhotos(){let photos=own(state.photos).sort((a,b)=>a.date.localeCompare(b.date));if(photos.length<2){toast('Necesitas al menos 2 fotos');return}modal('Comparar fotografías',`<div class="grid2"><div><label>Primera fecha</label><select id="cmpA" onchange="updateCompare()">${photos.map((x,i)=>`<option value="${x.id}">${dateFmt(x.date)}</option>`).join('')}</select></div><div><label>Segunda fecha</label><select id="cmpB" onchange="updateCompare()">${photos.map((x,i)=>`<option ${i===photos.length-1?'selected':''} value="${x.id}">${dateFmt(x.date)}</option>`).join('')}</select></div></div><div id="compareImages" class="grid2" style="margin-top:13px"></div><div class="info">Compara cambios visuales usando siempre postura, distancia e iluminación similares.</div>`);updateCompare()}function updateCompare(){let a=state.photos.find(x=>x.id===document.getElementById('cmpA')?.value),b=state.photos.find(x=>x.id===document.getElementById('cmpB')?.value);if(a&&b)document.getElementById('compareImages').innerHTML=`<img class="photo" src="${a.image}" alt="Foto primera fecha"><img class="photo" src="${b.image}" alt="Foto segunda fecha">`}
function addShopping(e){e.preventDefault();let name=new FormData(e.target).get('item').trim();if(!name)return;state.shopping.push({id:uid(),pid:p().id,name,done:false});save();render()}function toggleShopping(id){let x=state.shopping.find(x=>x.id===id);x.done=!x.done;save();render()}function clearBought(){state.shopping=state.shopping.filter(x=>!(x.pid===p().id&&x.done));save();render()}function addSuggestedShopping(){let names=['Huevos · 12','Arroz · 1 kg','Verduras variadas','Fruta de temporada','Legumbres','Yogur natural'];names.forEach(name=>{if(!own(state.shopping).some(x=>x.name===name))state.shopping.push({id:uid(),pid:p().id,name,done:false})});save();render()}async function copyShopping(){let t=`Lista de la compra · ${p().name}\n`+own(state.shopping).filter(x=>!x.done).map(x=>'• '+x.name).join('\n');try{if(navigator.share)await navigator.share({text:t});else if(navigator.clipboard)await navigator.clipboard.writeText(t);else throw new Error();toast('Lista compartida / copiada')}catch(e){modal('Copia la lista',`<textarea readonly>${esc(t)}</textarea>`)}}
function deleteItem(key,id){if(!confirm('¿Eliminar este registro?'))return;state[key]=state[key].filter(x=>x.id!==id);save();closeModal();render()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nubivanta-fit-copia-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}function importData(){modal('Restaurar una copia',`<div class="notice">Importar una copia sustituirá todos los datos actuales de este navegador. Exporta antes una copia si quieres conservarlos.</div><label>Archivo JSON</label><input type="file" id="jsonfile" accept="application/json,.json"><button class="btn" style="margin-top:12px" onclick="restoreData()">Restaurar</button>`)}async function restoreData(){let f=document.querySelector('#jsonfile').files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.profiles)||!Array.isArray(d.workouts)||!Array.isArray(d.meals))throw Error();if(!confirm('¿Seguro que quieres sustituir todos los registros actuales?'))return;state=d;save();closeModal();render()}catch{alert('El archivo no es una copia válida de Nubivanta Fit')}}function printReport(){let w=own(state.workouts),m=own(state.meals),ws=weightDay(),html=`<!doctype html><html lang="es"><meta charset="utf-8"><title>Informe Nubivanta Fit</title><style>body{font:15px Arial;margin:35px;color:#152d37}h1{color:#0b776c}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style><h1>Nubivanta Fit · Informe</h1><p>Perfil: ${esc(p().name)} · Generado ${dateFmt(today())}</p><h2>Objetivos</h2><p>${esc(p().goal)} · ${p().kcal} kcal objetivo diario (editable)</p><h2>Últimos pesos</h2><table><tr><th>Fecha</th><th>Peso</th></tr>${ws.slice(-15).map(x=>`<tr><td>${dateFmt(x.date)}</td><td>${x.weight} kg</td></tr>`).join('')}</table><h2>Últimos entrenamientos</h2><table><tr><th>Fecha</th><th>Actividad</th><th>Minutos</th></tr>${w.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20).map(x=>`<tr><td>${dateFmt(x.date)}</td><td>${esc(x.title)}</td><td>${x.minutes}</td></tr>`).join('')}</table><h2>Alimentación</h2><p>${m.length} comidas registradas. Total de kcal registradas: ${fmt(money(m))} (no constituye ingesta promedio).</p><p><small>Informe de registro personal, no evaluación médica.</small></p></html>`;let win=window.open('','_blank');if(!win){alert('Permite ventanas emergentes para imprimir el informe');return}win.document.write(html);win.document.close();setTimeout(()=>win.print(),500)}

/* Asistente inicial v1.1: cada perfil se configura independientemente. */
let setupStep=0;
const setupFields=[
 {title:'Tus datos',desc:'Configura tu perfil. Puedes cambiar cualquier dato más adelante.',html:x=>`<label>¿Cómo quieres que te llamemos?</label><input name="name" required value="${esc(x.name==='Mi perfil'||x.name==='Segundo perfil'?'':x.name)}" placeholder="Nombre"><div class="formgrid"><div><label>Edad</label><input name="age" type="number" min="16" max="110" value="${esc(x.age)}" required></div><div><label>Altura (cm)</label><input name="height" type="number" min="100" max="250" value="${esc(x.height)}" required></div><div><label>Peso (kg)</label><input name="weight" type="number" step="0.1" min="25" max="350" value="${esc(x.weight)}" required></div><div><label>Sexo para fórmulas energéticas (opcional)</label><select name="sex"><option value="">Prefiero no indicarlo</option><option value="mujer" ${x.sex==='mujer'?'selected':''}>Mujer</option><option value="hombre" ${x.sex==='hombre'?'selected':''}>Hombre</option></select></div></div>`},
 {title:'Tu objetivo',desc:'Selecciona lo que más te importa ahora.',html:x=>`<label>Objetivo principal</label><select name="goal">${[['recomposicion','Ganar músculo y perder grasa'],['perder','Perder grasa'],['ganar','Ganar músculo'],['resistencia','Mejorar resistencia'],['competicion','Preparar competición'],['bienestar','Bienestar general']].map(([v,t])=>`<option value="${v}" ${x.goal===v?'selected':''}>${t}</option>`).join('')}</select><label>Meta y fecha (opcional)</label><textarea name="goalDetail" placeholder="Ej.: correr 10 km en 45 minutos en marzo">${esc(x.goalDetail||'')}</textarea>`},
 {title:'Tu nivel',desc:'Usaremos tu experiencia para preparar propuestas de actividad.',html:x=>`<label>Nivel actual</label><select name="level">${['principiante','intermedio','avanzado'].map(v=>`<option ${x.level===v?'selected':''}>${v}</option>`).join('')}</select><label>Deportes que practicas</label><input name="sports" value="${esc(x.sports||'')}" placeholder="Pádel, correr, fuerza..."><label>Marcas o referencias recientes (opcional)</label><textarea name="marks" placeholder="5 km en 25 minutos, sentadilla 60 kg...">${esc(x.marks||'')}</textarea>`},
 {title:'Estado físico',desc:'La seguridad y las adaptaciones son importantes. Estos datos permanecen en este navegador.',html:x=>`<label>¿Hay lesiones, operaciones, dolor o limitaciones?</label><textarea name="restrictions" placeholder="Indica lo que quieras tener en cuenta">${esc(x.restrictions||'')}</textarea><label>Situación especial</label><select name="special"><option value="">Ninguna indicada</option><option value="embarazo" ${x.special==='embarazo'?'selected':''}>Embarazo</option><option value="posparto" ${x.special==='posparto'?'selected':''}>Posparto</option><option value="rehabilitacion" ${x.special==='rehabilitacion'?'selected':''}>Rehabilitación / recuperación</option></select><div class="notice">Ante embarazo, lesiones o recuperación quirúrgica, las propuestas son orientativas y deben respetar las indicaciones médicas. No se generarán planes intensos automáticamente.</div>`},
 {title:'Tu disponibilidad',desc:'Podrás cambiar cualquier entrenamiento cuando surja un imprevisto.',html:x=>`<label>Días habituales para entrenar</label><div class="weekbar">${[['L',1],['M',2],['X',3],['J',4],['V',5],['S',6],['D',0]].map(([t,d])=>`<label class="pill" style="min-width:43px"><input type="checkbox" name="days" value="${d}" ${(x.days||[]).includes(d)?'checked':''} style="min-height:0;width:14px;height:14px"> ${t}</label>`).join('')}</div><label>Tiempo habitual por sesión (minutos)</label><input name="minutes" type="number" min="10" max="240" value="${x.minutes||40}" required><label>Lugar habitual</label><select name="location">${['casa','gimnasio','exterior','viaje'].map(v=>`<option ${x.location===v?'selected':''}>${v}</option>`).join('')}</select><label>Material disponible</label><textarea name="equipment" placeholder="Mancuernas, barra, bici...">${esc(x.equipment||'')}</textarea>`},
 {title:'Alimentación',desc:'No asignaremos automáticamente dietas restrictivas. Puedes ajustar metas y registrar comidas desde Nutrición.',html:x=>`<label>Tipo de alimentación o preferencias</label><input name="diet" value="${esc(x.diet||'')}" placeholder="Mediterránea, vegetariana..."><label>Alergias, alimentos que evitas o intolerancias</label><textarea name="foodLimits" placeholder="Opcional">${esc(x.foodLimits||'')}</textarea><label>Alimentos favoritos</label><textarea name="favorites" placeholder="Opcional">${esc(x.favorites||'')}</textarea><div class="notice">El objetivo inicial de calorías es orientativo y editable. Durante el embarazo no se establecerá automáticamente un déficit calórico.</div>`}
];
function onboarding(step=0){
 setupStep=Math.max(0,Math.min(setupFields.length-1,step));const d=setupFields[setupStep],x=p();
 modal('Configura tu perfil · '+(setupStep+1)+'/'+setupFields.length,`<p class="muted">${d.desc}</p><div class="progress"><div style="width:${(setupStep+1)/setupFields.length*100}%"></div></div><form onsubmit="setupNext(event)">${d.html(x)}<div class="actions">${setupStep?'<button class="btn ghost" type="button" onclick="onboarding(setupStep-1)">Anterior</button>':''}<button class="btn" type="submit">${setupStep===setupFields.length-1?'Terminar configuración':'Continuar →'}</button></div></form>`);
}
function setupNext(e){
 e.preventDefault();const f=new FormData(e.target),x=p();
 for(const [k,v] of f.entries()){if(k==='days')continue;if(['age','height','weight','minutes'].includes(k))x[k]=Number(v)||0;else x[k]=String(v)}
 if(setupStep===4)x.days=f.getAll('days').map(Number);
 if(setupStep===setupFields.length-1){x.setupComplete=true;save();closeModal();render();toast('Perfil configurado');return}
 if(!save())return;onboarding(setupStep+1);
}
function configureProfile(){onboarding(0)}

selectProfiles();render();if(!p().setupComplete)onboarding(0);
</script></body></html>
